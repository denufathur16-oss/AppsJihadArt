<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#03261d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Program Jihad PJ">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png">
  <title>Program Jihad PJ</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#03261d;color:#17231f}
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,#03261d,#07553f)}
    .card{width:min(460px,100%);background:#fff;border-radius:24px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.28);text-align:center}
    .logo{width:84px;height:84px;border-radius:20px;display:block;margin:0 auto 18px}.title{margin:0;font-size:22px}.sub{margin:8px 0 22px;color:#687670;font-size:13px;line-height:1.6}
    .loading{height:6px;border-radius:99px;background:#e5ece9;overflow:hidden}.loading:after{content:"";display:block;width:38%;height:100%;background:#07553f;border-radius:99px;animation:load 1s infinite ease-in-out}@keyframes load{0%{transform:translateX(-110%)}100%{transform:translateX(290%)}}
    .error{display:none;margin-top:16px;padding:12px 14px;background:#fff1f0;color:#b42318;border-radius:12px;font-size:12px;line-height:1.5;text-align:left}
    .btn{display:none;margin-top:16px;width:100%;height:48px;border:0;border-radius:12px;background:#07553f;color:#fff;font-weight:800;cursor:pointer}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <img class="logo" src="./icon-192.png" alt="Program Jihad PJ">
      <h1 class="title">Program Jihad PJ</h1>
      <p class="sub">Membuka aplikasi. Mohon tunggu...</p>
      <div id="loading" class="loading"></div>
      <div id="error" class="error"></div>
      <button id="retry" class="btn">BUKA APLIKASI</button>
    </section>
  </main>
<script>
(async function(){
  const error=document.getElementById('error');
  const retry=document.getElementById('retry');
  const loading=document.getElementById('loading');
  let appUrl='';
  try{
    const res=await fetch('./config.json',{cache:'no-store'});
    if(!res.ok) throw new Error('config.json tidak ditemukan.');
    const config=await res.json();
    appUrl=String(config.appUrl||'').trim();
    if(!/^https:\/\/script\.google\.com\/macros\/s\/[^\s]+\/exec(?:\?.*)?$/.test(appUrl)) throw new Error('URL Web App pada config.json tidak valid.');
    location.replace(appUrl);
  }catch(e){
    loading.style.display='none';
    error.textContent=e.message||'Gagal membuka aplikasi.';
    error.style.display='block';
    retry.style.display='block';
    retry.onclick=()=>location.reload();
  }
  if('serviceWorker' in navigator){
    window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  }
})();
</script>
</body>
</html>
